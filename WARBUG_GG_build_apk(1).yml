name: Build WARBUG GG APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WARBUG_GG_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        run: |
          unzip -o WARBUG_GG_Android_Project.zip -d source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/WARBUG_GG_Project" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WARBUG-GG-APK
          path: source/WARBUG_GG_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
